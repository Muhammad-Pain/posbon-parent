name: Сохтани APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Гирифтани код
        uses: actions/checkout@v4

      - name: Насби Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Сохтани APK-ҳо
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE"
          mkdir -p ~/.android
          cp "$ROOT/ci/debug.keystore" ~/.android/debug.keystore

          build_app () {
            SRC="$1"; PROJ="$2"; LABEL="$3"; LOC="$4"
            rm -rf "/tmp/$PROJ"
            flutter create --platforms=android --org com.posbon --project-name "$PROJ" "/tmp/$PROJ"
            M="/tmp/$PROJ/android/app/src/main/AndroidManifest.xml"
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
            if [ "$LOC" = "yes" ]; then
              sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application|' "$M"
            fi
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"$LABEL\"|" "$M"
            rm -rf "/tmp/$PROJ/lib" "/tmp/$PROJ/test"
            mkdir -p "/tmp/$PROJ/lib"
            cp "$ROOT/$SRC" "/tmp/$PROJ/lib/main.dart"
            cp "$ROOT/pubspec.yaml" "/tmp/$PROJ/pubspec.yaml"
            ( cd "/tmp/$PROJ" && flutter pub get && flutter build apk --release )
            cp "/tmp/$PROJ/build/app/outputs/flutter-apk/app-release.apk" "$ROOT/$PROJ.apk"
          }

          build_app parent/main.dart posbon_parent "Посбон" no
          build_app child/main.dart posbon_child "Посбон Кӯдак" yes

      - name: APK-и волидайн
        uses: actions/upload-artifact@v4
        with:
          name: posbon-parent-apk
          path: posbon_parent.apk

      - name: APK-и кӯдак
        uses: actions/upload-artifact@v4
        with:
          name: posbon-child-apk
          path: posbon_child.apk
